<body data-page="contact">
<a class="skip" href="#main">মূল বিষয়বস্তুতে যান</a>
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="container"><nav class="crumbs"><a href="index.html">প্রথম পাতা</a> / <span>যোগাযোগ</span></nav><h1 data-en="Contact Us">যোগাযোগ</h1><p>আমাদের সাথে যোগাযোগ করুন</p></div></section>

<section class="section"><div class="container grid-2">
  <div>
    <div class="contact-cards">
      <div class="card"><span>📍</span><h3>ঠিকানা</h3><p id="cAddress"></p></div>
      <div class="card"><span>📞</span><h3>ফোন</h3><p id="cPhone"></p></div>
      <div class="card"><span>✉️</span><h3>ইমেইল</h3><p id="cEmail"></p></div>
      <div class="card"><span>🕘</span><h3>অফিস সময়</h3><p>শনি – বৃহস্পতি: সকাল ৯টা – বিকাল ৪টা</p></div>
    </div>
    <div class="map" id="map"></div>
  </div>
  <div class="card form-card">
    <h2>বার্তা পাঠান</h2>
    <form id="contactForm" class="form-grid">
      <label>আপনার নাম *<input name="name" required maxlength="80"></label>
      <label>মোবাইল / ইমেইল *<input name="contact" required maxlength="100"></label>
      <label class="full">বিষয়<input name="subject" maxlength="120"></label>
      <label class="full">বার্তা *<textarea name="message" required rows="6" maxlength="2000"></textarea></label>
      <button class="btn btn-primary btn-lg" type="submit">পাঠান</button>
    </form>
  </div>
</div></section>

</main>
<div id="site-footer"></div>
