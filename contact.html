<body data-page="contact">
<a class="skip" href="#main">মূল বিষয়বস্তুতে যান</a>
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="container">
  <nav class="crumbs" aria-label="অবস্থান"><a href="index.html">প্রথম পাতা</a><span>/</span><span aria-current="page">যোগাযোগ</span></nav>
  <h1 data-en="Contact Us">যোগাযোগ</h1><p>আমাদের সাথে যোগাযোগ করুন</p>
</div></section>

<section class="section"><div class="container grid-2">
  <div>
    <dl class="contact-list-lg">
      <div><i data-icon="pin"></i><dt>ঠিকানা</dt><dd id="cAddress"></dd></div>
      <div><i data-icon="phone"></i><dt>ফোন</dt><dd id="cPhone"></dd></div>
      <div><i data-icon="mail"></i><dt>ইমেইল</dt><dd id="cEmail"></dd></div>
      <div><i data-icon="clock"></i><dt>অফিস সময়</dt><dd>শনি – বৃহস্পতি, সকাল ৯টা – বিকাল ৪টা</dd></div>
    </dl>
    <div class="map" id="map"></div>
  </div>
  <div class="card form-card">
    <h2>বার্তা পাঠান</h2>
    <form id="contactForm" class="form-grid">
      <label>আপনার নাম <em>*</em><input name="name" required maxlength="80"></label>
      <label>মোবাইল / ইমেইল <em>*</em><input name="contact" required maxlength="100"></label>
      <label class="full">বিষয়<input name="subject" maxlength="120"></label>
      <label class="full">বার্তা <em>*</em><textarea name="message" required rows="6" maxlength="2000"></textarea></label>
      <div class="full"><button class="btn btn-primary" type="submit">পাঠান</button></div>
    </form>
  </div>
</div></section>

</main>
